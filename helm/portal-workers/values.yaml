# values.yaml — portal-workers chart defaults
# Maintained by Platform Engineering.
# Defines all keys the chart accepts. Overridden by values-platform.yaml,
# then values-config.yaml, then values-env.yaml.

image:
  repository: gcr.io/meridian-capital/compass-portal-workers
  tag: "latest"
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

port: 8081

serviceAccount:
  name: portal-workers
  annotations:
    eks.amazonaws.com/role-arn: ""  # set in values-env.yaml per environment

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

env:
  NOTIFICATION_RETRY_LIMIT: ""
